<html><head><meta charset="utf-8"><link rel="stylesheet" href="base2d.css"><style>
body{background:#0b1d3a}.lbl{font:800 44px Poppins;fill:#fff}.tag{position:absolute;left:140px;width:800px;display:flex;justify-content:space-between;background:#fff;border-radius:24px;padding:26px 40px;font:700 48px Poppins;color:#0b1d3a;box-shadow:0 14px 0 #f5a623;opacity:0}
#tot{position:absolute;left:0;right:0;top:720px;text-align:center;font:900 140px Poppins;color:#f5a623;opacity:0}</style></head><body>
<div id="stage"><svg width="1080" height="1920" viewBox="0 0 1080 1920">
 <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="3" fill="#1d3a66"/></pattern></defs>
 <rect width="1080" height="1920" fill="url(#dots)"/>
 <g id="map"><path id="route" d="M860 560 C 840 860, 360 820, 300 1180" fill="none" stroke="#f5a623" stroke-width="10" stroke-linecap="round" stroke-dasharray="1"/>
 <circle cx="860" cy="560" r="26" fill="#e74c3c"/><text class="lbl" x="690" y="510">CHINA</text>
 <circle cx="300" cy="1180" r="26" fill="#2ecc71"/><text class="lbl" x="180" y="1260">MAPUTO</text>
 <g id="ship"><g transform="rotate(90) translate(-40,-30)"><rect x="0" y="20" width="80" height="30" rx="8" fill="#fff"/><rect x="12" y="2" width="22" height="20" fill="#e74c3c"/><rect x="38" y="2" width="22" height="20" fill="#3498db"/></g></g></g>
</svg></div>
<div id="ui"><div class="title" id="h1" style="top:140px;color:#fff">QUANTO CUSTA<br><span style="color:#f5a623">IMPORTAR?</span></div>
<div class="tag" id="a" style="top:1000px"><span>Produto</span><span>45 000</span></div>
<div class="tag" id="b" style="top:1170px"><span>Frete</span><span>12 500</span></div>
<div id="tot">0 MT</div><div id="cap"></div></div>
<script type="module">
import {captions,timeWords,prog} from './core.js';import {count,pop,rise,along,draw} from './motion.js';
const route=document.getElementById('route'),ship=document.getElementById('ship');
const words=timeWords('Quanto custa importar da China até Maputo?',0,4.5,['china','maputo']);
document.getElementById('cap').style.top='1600px';
window.renderAt=t=>{draw(route,prog(t,.4,2.6));along(route,ship,prog(t,.6,2.8));pop(h1,t,0);
 map.style.opacity=1-prog(t,3,3.4);rise(a,t,3.0);rise(b,t,3.6);
 tot.style.opacity=prog(t,3.4,3.7);count(tot,0,57500,t,3.4,1,' MT');captions(words,t);};
</script></body></html>
