  art:[{d:R(110,430,36,140,9),c:'w',s:0,f:[.1,.35]},{d:P([146,455],[540,455]),c:'r',s:0,f:[.4,.8],arm:1},
   {d:R(215,70,240,300,18),c:'w',s:1,f:[0,.35]},{d:P([252,130],[418,130]),c:'w',s:1,f:[.35,.45]},{d:P([252,180],[418,180]),c:'w',s:1,f:[.45,.55]},{d:P([252,230],[360,230]),c:'w',s:1,f:[.55,.62]},

const NP=9;

for(const l of L){l.S=l.segs.map(txt=>{const ws=txt.split(/\s+/).map(w=>{const cls=w.includes('*')?'hm':w.includes('_')?'hr':'';return{w:w.replace(/[*_]/g,''),cls};});
  const o={ws,k0:k};ws.forEach((w,i)=>{w.s=W[k+i].s-LEAD;w.e=W[k+i].e;});k+=ws.length;o.t0=ws[0].s;o.t1=ws[ws.length-1].e;return o;});
 l.t0=l.S[0].t0;l.solI=l.sol??1;l.nameI=l.S.length-1;l.ts=l.S[Math.min(l.solI,l.S.length-1)].t0;l.tn=l.S[l.nameI].t0;}
if(k!==W.length)throw new Error(`o roteiro tem ${k} palavras e palavras.json tem ${W.length}`);
const FIM=L[L.length-1],TP=FIM.S[0].t0,TF1=FIM.S[1].t0,TF2=FIM.S[2].t0,TE=W[W.length-1].e,TC=TE+.25;

window.MAXB=()=>Math.max(...[...document.querySelectorAll('.scr')].map(e=>1150+e.offsetHeight));window.TEMPOS={L:L.map(l=>({t0:l.t0,ts:l.ts,tn:l.tn,nome:l.nome})),TP,TF1,TF2,TC};

 const ring=document.createElementNS(NS,'circle');ring.setAttribute('cx',320);ring.setAttribute('cy',320);ring.setAttribute('fill','none');ring.setAttribute('stroke',MINT);ring.setAttribute('stroke-width',5);ring.style.opacity=0;sv.appendChild(ring);
 l.ring=ring;l.g=g;

  pa.setAttribute('stroke',col);pa.setAttribute('stroke-width',e.c==='w'?6:7.5);pa.style.fill=col;pa.style.fillOpacity=0;g.appendChild(pa);e.el=pa;e.len=pa.getTotalLength();e.col=col;

 // elementos sem f: partilham a frase, pelo comprimento

 for(const s in by){const sg=l.S[s],tot=by[s].reduce((a,e)=>a+e.len,0),d=sg.t1-sg.t0-.1;let a=sg.t0+.08;for(const e of by[s]){e.a=a;a+=d*e.len/tot;e.b=a;}}
 p.appendChild(sv);iso.appendChild(p);plates.push(p);l.plate=p;l.sv=sv;});
